name: CI

on:
  push:
    branches:
    - main

jobs:
  terraform:
    name: Verify Terraform
    uses: unfunco/meta/.github/workflows/verify-terraform.yaml@dc15f9a32fe01b1b7cc44e095ab9e9bdd98bb0b7
    with:
      terraform-version-file: .terraform-version
      working-directory: .

  verify:
    name: Verify
    needs: [ terraform ]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Determine Terraform version
      id: terraform-version
      run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.terraform-version.outputs.version }}
    - name: Initialise with no backend
      run: terraform init -backend=false
    - name: Run Terraform tests
      run: terraform test
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: 3.14
    - name: Check Python formatting
      uses: psf/black@87928e6d6761a4a6d22250e1fee5601b3998086e
      with:
        src: lambda
        version: 26.3.1

  release:
    name: Release?
    needs: [ verify ]
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - name: Prepare a release
      uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      with:
        config-file: .github/release-please-config.json
        manifest-file: .github/release-please-manifest.json
        token: ${{ secrets.GITHUB_TOKEN }}
