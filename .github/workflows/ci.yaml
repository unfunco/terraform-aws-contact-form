name: CI

on:
  push:
    branches:
    - main

jobs:
  terraform:
    name: Verify Terraform
    uses: unfunco/meta/.github/workflows/verify-terraform.yaml@ed74a86a4f828ad47a4c65139c4be4101b23a294 # v0.4.0
    with:
      run-tests: true

  verify:
    name: Verify
    needs: [ terraform ]
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
    - name: Set up Python
      uses: actions/setup-python@v7.1.0
      with:
        python-version: 3.14
    - name: Check Python formatting
      uses: psf/black@26.10.1
      with:
        src: lambda
        version: 26.3.1

  release:
    name: Release?
    needs: [ verify ]
    permissions:
      contents: write
      pull-requests: write
    uses: unfunco/meta/.github/workflows/release-please.yaml@ed74a86a4f828ad47a4c65139c4be4101b23a294 # v0.4.0
