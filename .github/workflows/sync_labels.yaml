name: Sync labels

on:
  push:
    branches: [ main ]
    paths: [ .github/workflows/sync_labels.yaml ]
  workflow_dispatch:
    inputs:
      delete-extra-labels:
        default: false
        description: Delete labels outside the canonical set.
        required: false
        type: boolean

permissions:
  contents: read

jobs:
  sync:
    name: Sync
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: unfunco/meta/.github/workflows/sync-labels.yaml@724bfc4bf30a9b93758939d5fb7c427828cc6c23
    with:
      delete-extra-labels: ${{ inputs.delete-extra-labels || false }}
