name: PR

on:
  pull_request: { }

jobs:
  terraform:
    name: Verify Terraform
    uses: unfunco/meta/.github/workflows/verify-terraform.yaml@8a2e3873c609d86b9a67b353a9111bd44171240d # v0.3.0
    with:
      run-tests: true

  verify:
    name: Verify
    needs: [ terraform ]
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: 3.14
    - name: Check Python formatting
      uses: psf/black@258e7dbf348bc23cb70b8cdf693481c04634ebcc
      with:
        src: lambda
        version: 26.3.1
